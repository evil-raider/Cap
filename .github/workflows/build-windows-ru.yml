name: Build Cap for Windows (Russian)
on:
  workflow_dispatch:
  push:
    branches:
      - russian-localization
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Restore Russian catalog and commit it
        shell: bash
        run: |
          set -euo pipefail
          packed=apps/desktop-gpui/locales/ru.toml.gz.b64
          if [ -f "$packed" ]; then
            base64 --decode "$packed" | gzip -d > apps/desktop-gpui/locales/ru.toml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/desktop-gpui/locales/ru.toml
            git rm "$packed"
            git commit -m "Restore Russian localization catalog"
            git push origin HEAD:russian-localization || echo "Could not commit catalog; build will continue with the restored file."
          fi
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-js
      - uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708
        with:
          minimum-size: 16GB
          maximum-size: 24GB
          disk-root: 'D:'
      - name: Prepare environment
        shell: bash
        run: |
          version=$(node -e "const s=require('fs').readFileSync('apps/desktop-gpui/Cargo.toml','utf8'); console.log(s.match(/^version = \"([^\"]+)\"/m)[1])")
          printf 'appVersion=%s\nVITE_ENVIRONMENT=production\nNEXT_PUBLIC_WEB_URL=https://cap.so\nNEXTAUTH_URL=https://cap.so\nVITE_SERVER_URL=https://cap.so\nRUST_TARGET_TRIPLE=x86_64-pc-windows-msvc\n' "$version" > .env
          bun run cap-setup
      - name: Build desktop sidecars
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_DEBUG: '0'
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: ./scripts/build-desktop-binaries.sh "$RUST_TARGET_TRIPLE"
      - name: Build application
        shell: bash
        env:
          CI: 'false'
          CAP_I18N_STRICT: '1'
        run: node scripts/bundle-gpui.mjs "$RUST_TARGET_TRIPLE" --no-bundle
      - name: Bundle unsigned installer
        shell: bash
        run: node scripts/bundle-gpui.mjs "$RUST_TARGET_TRIPLE" --skip-build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Cap-Windows-Russian-unsigned
          path: apps/desktop-gpui/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
