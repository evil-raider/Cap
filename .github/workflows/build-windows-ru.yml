name: Build Cap for Windows (Russian)
on:
  workflow_dispatch:
  push:
    branches:
      - russian-localization
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested defaults to source
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cap-defaults-error.log"
          trap 'echo "::error title=Default settings preparation failed::$(tail -c 3000 "$log" | tr "\n" " ")"' ERR
          exec 2>"$log"
          patch=.github/cap-requested-defaults.patch
          if [ -f "$patch" ]; then
            # Read the LF-normalized Git blob rather than the Windows checkout.
            git show "HEAD:$patch" > "$RUNNER_TEMP/cap-defaults.patch"
            git apply --cached --check "$RUNNER_TEMP/cap-defaults.patch"
            git apply --cached "$RUNNER_TEMP/cap-defaults.patch"
            git diff --cached --name-only -z | xargs -0 git checkout-index -f --
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm "$patch"
            git commit -m "Set requested Windows recording defaults"
            git push origin HEAD:russian-localization
          fi
      - name: Restore Russian catalog
        shell: bash
        run: |
          if [ -f apps/desktop-gpui/locales/ru.toml.gz.b64 ]; then
            node -e 'const fs=require("fs"),z=require("zlib"); fs.writeFileSync("apps/desktop-gpui/locales/ru.toml",z.gunzipSync(Buffer.from(fs.readFileSync("apps/desktop-gpui/locales/ru.toml.gz.b64","utf8"),"base64")))'
          fi
      - name: Fit Russian labels
        shell: bash
        run: |
          node -e 'const fs=require("fs"),p="apps/desktop-gpui/locales/ru.toml"; let s=fs.readFileSync(p,"utf8"); s=s.replace("system_audio_on = \"Записывать системный звук\"","system_audio_on = \"Записывать звук ОС\"").replace("saving = \"Сохранение…\"","saving = \"Сохран…\""); fs.writeFileSync(p,s)'
      - name: Commit catalog fixes
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          packed=apps/desktop-gpui/locales/ru.toml.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop-gpui/locales/ru.toml
          if [ -f "$packed" ]; then git rm "$packed"; fi
          if ! git diff --cached --quiet; then
            git commit -m "Fit Russian labels to the interface"
            git push origin HEAD:russian-localization
          fi
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-js
      - uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708
        with:
          minimum-size: 16GB
          maximum-size: 24GB
          disk-root: 'D:'
      - name: Prepare environment
        shell: bash
        run: |
          version=$(node -e "const s=require('fs').readFileSync('apps/desktop-gpui/Cargo.toml','utf8'); console.log(s.match(/^version = \"([^\"]+)\"/m)[1])")
          printf 'appVersion=%s\nVITE_ENVIRONMENT=production\nNEXT_PUBLIC_WEB_URL=https://cap.so\nNEXTAUTH_URL=https://cap.so\nVITE_SERVER_URL=https://cap.so\nRUST_TARGET_TRIPLE=x86_64-pc-windows-msvc\n' "$version" > .env
          bun run cap-setup
      - name: Build desktop sidecars
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_DEBUG: '0'
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: ./scripts/build-desktop-binaries.sh "$RUST_TARGET_TRIPLE"
      - name: Build application
        shell: bash
        env:
          CI: 'false'
          CAP_I18N_STRICT: '1'
        run: node scripts/bundle-gpui.mjs "$RUST_TARGET_TRIPLE" --no-bundle
      - name: Bundle unsigned installer
        shell: bash
        run: node scripts/bundle-gpui.mjs "$RUST_TARGET_TRIPLE" --skip-build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Cap-Windows-Russian-unsigned
          path: apps/desktop-gpui/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
